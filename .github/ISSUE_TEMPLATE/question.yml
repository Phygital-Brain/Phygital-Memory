name: Question
description: Ask how to do something.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [FAQ](https://github.com/Phygital-Brain/Phygital-Memory/blob/main/docs/faq.md) and the [guides](https://github.com/Phygital-Brain/Phygital-Memory/blob/main/docs/README.md) may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Please don't include passwords, recovery words, keys or the contents of your notes.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried or read so far?
