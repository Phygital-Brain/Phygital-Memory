name: Something doesn't work
description: Report a bug or an error message.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Before you start, have a look at [Troubleshooting](https://github.com/Phygital-Brain/Phygital-Memory/blob/main/docs/troubleshooting.md): many problems have a quick fix there.

        **Security problem?** Don't post it here. Use [private reporting](https://github.com/Phygital-Brain/Phygital-Memory/security/advisories/new) instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: This page is public once the repository opens. Anyone can read it.
      options:
        - label: I removed passwords, recovery words, keys, tokens and the contents of my notes from everything below.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact message, if there was one.
      render: text
  - type: dropdown
    id: kind
    attributes:
      label: Which kind of memory?
      options:
        - Open (a plain folder)
        - Encrypted (a locked vault)
        - Both
        - Not about a memory
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does the memory live?
      multiple: true
      options:
        - Only on this computer
        - In a cloud folder (iCloud Drive, Dropbox, Nextcloud, Google Drive)
        - WebDAV
        - Backed up to GitHub
        - Backed up to S3 or R2
        - Shared with someone
        - Linked to my other Mac
  - type: dropdown
    id: app
    attributes:
      label: Which AI app?
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Codex
        - Another MCP app
        - Not about an AI app
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in the name of the file you installed, or the date you installed or last updated.
      placeholder: 0.1.0
