# Docs checks: runs scripts/check.py and tests/test_docs.py (links and anchors, no long dashes or three dots, every guide
# listed in the README, settings and AI tools matching the code, version numbers matching), then zizmor on the workflows
# (leaked tokens, injection, broad permissions). Needs no secrets and changes nothing.
#
# FOR NOW: by hand only (Actions tab, or: gh workflow run checks.yml), to save GitHub minutes while the repo is private.
# When the repo goes public, put back the template triggers in place of "workflow_dispatch:":
#   push:
#   pull_request:
name: checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - run: python3 scripts/check.py
      - run: pipx run pytest -q tests/test_docs.py

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      # Unsafe patterns in GitHub Actions: leaked tokens, injection, broad permissions.
      - run: pipx run zizmor==1.31.1 --offline .
