# Builds Phygital Memory for Mac, Windows and Linux from one tag (v0.2.0, say) and puts all of them in one draft
# GitHub Release, with latest.json for the app's updater. Publish the draft by hand once it looks right.
#
# Secrets (Settings › Secrets and variables › Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   signs each update (.signing/updater.key)
#   MACOS_HELPER_P12, MACOS_HELPER_P12_PASSWORD                     optional: the Touch ID helper's fixed certificate
#                                                                   (base64 of .signing/id.p12). Without it the Mac
#                                                                   app is built without Touch ID.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build one system only, to save minutes (blank: all)"
        type: choice
        options: ["", macos-14, windows-latest, ubuntu-22.04, ubuntu-22.04-arm]
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # to make the draft release and upload to it
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only && format('["{0}"]', inputs.only) || '["macos-14", "windows-latest", "ubuntu-22.04", "ubuntu-22.04-arm"]') }}
        # ubuntu-22.04-arm: Linux on ARM computers. (No "include" here: it would add a Mac job to a one-system run.)
    env:
      PYTHONUTF8: "1"   # Windows' Python otherwise writes the licence files in its old code page
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No caches in a release build: a poisoned cache could slip into the app people download.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: The screens
        working-directory: core/frontend
        run: npm ci && npm run build
      - name: The engine
        working-directory: core
        run: uv sync --frozen && uv run python packaging/build.py
      - name: The engine for Intel Macs (built on this Apple-chip Mac, through Rosetta)
        if: runner.os == 'macOS'
        working-directory: core
        run: |
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          # cryptography stopped making Intel Mac builds at version 49: the Intel engine keeps 48.0.1, the last one
          uv export --frozen --no-hashes --format requirements-txt | sed 's/^cryptography==.*/cryptography==48.0.1/' > "$RUNNER_TEMP/intel.txt"
          uv venv .venv-intel --python cpython-3.14-macos-x86_64-none
          VIRTUAL_ENV=.venv-intel uv pip install --only-binary cryptography -r "$RUNNER_TEMP/intel.txt" pyinstaller
          # the build tools it calls run as Apple-chip programs (newer developer tools have no Intel part)
          mkdir -p "$RUNNER_TEMP/shim"
          for t in lipo codesign otool install_name_tool; do printf '#!/bin/sh\nexec arch -arm64 /usr/bin/%s "$@"\n' $t > "$RUNNER_TEMP/shim/$t"; chmod +x "$RUNNER_TEMP/shim/$t"; done
          PATH="$RUNNER_TEMP/shim:$PATH" .venv-intel/bin/python packaging/build.py --dist packaging/dist-intel
      - name: Engine, Syncthing, rclone and licences into the app
        working-directory: core
        run: uv run python packaging/bundle_server.py --fetch ${{ runner.os == 'macOS' && '--intel packaging/dist-intel/phygital-memory-server' || '' }}

      - name: Touch ID helper (Mac, with the fixed certificate)
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_HELPER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_HELPER_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::No MACOS_HELPER_P12 secret: this Mac build has no Touch ID."; exit 0; fi
          KC="$RUNNER_TEMP/helper.keychain-db"; KCP="$(uuidgen)"
          security create-keychain -p "$KCP" "$KC" && security unlock-keychain -p "$KCP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null   # codesign may use the key
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')   # and can find it
          ID=$(security find-identity "$KC" | awk '/Phygital Memory Local Signing/ {print $2; exit}')
          T=core/packaging/touchid
          swiftc -O -o "$T/bin/Phygital Memory" "$T/main.swift"
          codesign -f -s "$ID" --keychain "$KC" -i "Phygital Memory" "$T/bin/Phygital Memory"
          mkdir -p app/src-tauri/server/touchid && cp -p "$T/bin/Phygital Memory" app/src-tauri/server/touchid/
          # the same helper for the Intel engine (the Apple-chip one above stays exactly as it was)
          mkdir -p "$RUNNER_TEMP/intel" app/src-tauri/server/intel/touchid
          swiftc -O -target x86_64-apple-macos13 -o "$RUNNER_TEMP/intel/Phygital Memory" "$T/main.swift"
          codesign -f -s "$ID" --keychain "$KC" -i "Phygital Memory" "$RUNNER_TEMP/intel/Phygital Memory"
          cp -p "$RUNNER_TEMP/intel/Phygital Memory" app/src-tauri/server/intel/touchid/

      - name: Build the app and upload it to the draft release
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Phygital Memory __VERSION__
          releaseBody: See CHANGELOG.md for what's new.
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.os == 'macos-14' && '--target universal-apple-darwin' || '' }}   # one Mac download for Apple and Intel chips
      - name: The same files under names without the version, for one-click download links
        # README buttons and the install commands point at releases/latest/download/<these names>
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "$PATHS" | python3 -c 'import json,sys; [print(p) for p in json.load(sys.stdin)]' | while read -r f; do
            case "$f" in
              *universal.dmg) n=Phygital-Memory-mac.dmg ;;
              *x64-setup.exe) n=Phygital-Memory-windows-setup.exe ;;
              *x64_en-US.msi) n=Phygital-Memory-windows.msi ;;
              *_amd64.deb) n=Phygital-Memory-linux-amd64.deb ;;
              *_arm64.deb) n=Phygital-Memory-linux-arm64.deb ;;
              *x86_64.rpm) n=Phygital-Memory-linux-x86_64.rpm ;;
              *aarch64.rpm) n=Phygital-Memory-linux-aarch64.rpm ;;
              *_amd64.AppImage) n=Phygital-Memory-linux-amd64.AppImage ;;
              *_aarch64.AppImage) n=Phygital-Memory-linux-aarch64.AppImage ;;
              *) continue ;;
            esac
            gh api -X POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${n}" \
              -H "Content-Type: application/octet-stream" --input "$f" > /dev/null && echo "uploaded $n"
          done
