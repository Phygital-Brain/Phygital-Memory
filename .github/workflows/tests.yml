# Tests on Mac, Windows and Linux at every push: the engine's tests that need no secret store or second app,
# then the built engine run and used for real, then a compile check of the app window. (The sharing and server tests run on the Mac for now; see AGENTS.md.
# test_docx needs pandoc to make its sample files, so it runs on the Mac too.)
name: tests

on:
  push:
    branches: [main]   # (a pull request is tested once, below, not twice)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run still going for an older one (saves build minutes).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: Tests
        env:
          OFFLINE: "1"
          PHYGITAL_MEMORY_OFFLINE: "1"
          PYTHONPATH: .
          PYTHONUTF8: "1"
        run: |
          set -e
          for t in test_open test_tasks_note test_brain test_backup_file test_import_export test_conflicts test_versions_cleanup; do
            echo "== $t"
            PHYGITAL_MEMORY_STATE="$(mktemp -d)" uv run python "tests/$t.py"
          done

  built:
    name: built engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: The screens
        working-directory: core/frontend
        run: npm ci && npm run build
      - name: Build the engine into one program
        run: uv sync --frozen && uv run python packaging/build.py
      - name: Run it and use it (Open and Encrypted memories, search, AI tasks, the AI door)
        env:
          PYTHONUTF8: "1"
        run: uv run python tests/test_smoke_server.py packaging/dist/phygital-memory-server/phygital-memory-server

  webdav:
    name: WebDAV, with WebDAV only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]   # the Mac runs it at home (its drive needs no install)
    defaults:
      run:
        working-directory: core
        shell: bash
    env:
      RCLONE: "1.75.2"   # the same version the app ships (core/packaging/bundle_server.py)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: rclone, and what the hidden drive needs (FUSE on Linux, WinFsp on Windows)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then os=windows; choco install winfsp -y --no-progress; else os=linux; sudo apt-get update && sudo apt-get install -y fuse3; fi
          curl -sSfLo "$RUNNER_TEMP/rc.zip" "https://downloads.rclone.org/v$RCLONE/rclone-v$RCLONE-$os-amd64.zip"
          unzip -q "$RUNNER_TEMP/rc.zip" -d "$RUNNER_TEMP/rc" && echo "$(cd "$RUNNER_TEMP"/rc/rclone-* && pwd)" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - name: Test
        env:
          OFFLINE: "1"
          PYTHONPATH: .
          PYTHONUTF8: "1"
          PYTHON_KEYRING_BACKEND: ${{ runner.os == 'Linux' && 'keyrings.alt.file.PlaintextKeyring' || '' }}   # a CI Linux has no keyring
        run: uv run --with keyrings.alt python tests/test_webdav_open.py

  window:
    name: app window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Compile check
        working-directory: app/src-tauri
        shell: bash
        run: mkdir -p server && cargo check --locked
