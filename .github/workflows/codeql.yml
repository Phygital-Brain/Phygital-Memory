# Code scanning with GitHub's CodeQL: looks for common vulnerabilities in the engine (Python) and the screens and
# Claude Desktop bridge (JavaScript). Results show in the Security tab, under Code scanning. Free on public repositories.
# On a private repository it fails with "Code scanning is not enabled" unless the account has GitHub Code Security (paid).
# Languages: python, javascript-typescript, go, java-kotlin, csharp, cpp, ruby, swift, actions. The window (Rust) is not
# in this list, so it is not scanned here.
name: CodeQL

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "41 3 * * 3"}]   # Wednesdays, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # to upload the results
      contents: read
      actions: read            # needed on private repositories, harmless on public ones
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1, pinned
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1, pinned
