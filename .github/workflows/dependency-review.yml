# Blocks a change that adds a dependency with a known moderate or worse vulnerability (Python in core/uv.lock,
# JavaScript in core/frontend, Rust crates in app/src-tauri, GitHub Actions). Needs the dependency graph switched on
# (on by default for public repositories).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0, pinned
        with:
          fail-on-severity: moderate
