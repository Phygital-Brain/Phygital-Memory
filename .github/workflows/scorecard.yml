# OpenSSF Scorecard: scores the repository's security habits (pinned actions, branch protection, tests, signed releases)
# and publishes the score for the badge. Public repositories only. Runs in the original project, not in forks.
name: Scorecard

on:
  branch_protection_rule:
  schedule: [{cron: "23 5 * * 2"}]   # Tuesdays, 05:23 UTC
  push: {branches: [main]}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    if: github.repository == 'Phygital-Brain/Phygital-Memory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # to upload the results
      id-token: write          # to publish the score
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e   # v2.5.0, pinned
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1, pinned
        with:
          sarif_file: results.sarif
