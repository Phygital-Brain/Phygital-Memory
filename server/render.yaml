# One-click deploy on Render (docs/server.md). In Render: New, Blueprint, this repository, Blueprint path server/render.yaml.
# Render gives the service an address; set PHYGITAL_MEMORY_URL to it after the first deploy.
services:
  - type: web
    name: phygital-memory
    runtime: image
    image:
      url: ghcr.io/phygital-brain/phygital-memory:latest
    plan: starter
    envVars:
      - key: PHYGITAL_MEMORY_URL
        sync: false
      - key: PORT
        value: "8790"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
