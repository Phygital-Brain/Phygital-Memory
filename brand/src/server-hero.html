<link rel="stylesheet" href="kit.css">
<style>
body{width:1280px;height:640px;position:relative;overflow:hidden}
svg text{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;fill:#A7A39A}
</style>
<body>
<div style="position:absolute;left:72px;top:150px;display:flex;align-items:center;gap:14px">
  <img src="../phygital-memory-mark.svg" style="width:46px">
  <div class="card-t" style="font-size:24px">Phygital Memory <span class="lime">Server</span></div>
</div>
<div class="card-t" style="position:absolute;left:70px;top:224px;font-size:46px;font-weight:800;line-height:1.04">Your server.<br>Your data.<br><span class="lime">Your phone.</span></div>
<div class="muted" style="position:absolute;left:72px;top:400px;width:480px;font-size:20px;line-height:1.45">Self-host your memory. The AI on your phone reaches it, even when your computer is off.</div>

<svg style="position:absolute;left:600px;top:0" width="680" height="640" viewBox="0 0 680 640" fill="none"><g transform="translate(44 34) scale(0.88)">
  <defs>
    <g id="unit">
      <rect width="72" height="44" rx="4" fill="#07080C" stroke="#2A303C"/>
      <circle cx="12" cy="22" r="3" fill="#C8F031"/>
      <path d="M26 15 H62 M26 22 H62 M26 29 H62" stroke="#2A303C" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="rack">
      <rect width="96" height="300" rx="8" fill="#161A22" stroke="#2A303C" stroke-width="1.5"/>
      <use href="#unit" x="12" y="14"/><use href="#unit" x="12" y="70"/><use href="#unit" x="12" y="126"/>
      <use href="#unit" x="12" y="182"/><use href="#unit" x="12" y="238"/>
    </g>
  </defs>

  <!-- the protected zone, locked -->
  <rect x="160" y="124" width="360" height="392" rx="20" stroke="#4a5e16" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="312" y="108" width="56" height="32" fill="#0B0D12"/>
  <g transform="translate(328 108)">
    <path d="M5 12 V8 a7 7 0 0 1 14 0 V12" stroke="#C8F031" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="1" y="12" width="22" height="17" rx="3.5" fill="#C8F031"/>
    <circle cx="12" cy="19.5" r="2.4" fill="#0B0D12"/><rect x="11" y="20" width="2" height="5" rx="1" fill="#0B0D12"/>
  </g>

  <!-- the racks -->
  <use href="#rack" x="186" y="170"/>
  <use href="#rack" x="292" y="170"/>
  <use href="#rack" x="398" y="170"/>
  <circle cx="340" cy="320" r="42" fill="#161A22"/>
  <text x="340" y="548" text-anchor="middle">YOUR SERVER</text>

  <!-- wires, with a spark at each end -->
  <path d="M92 330 C140 330 140 300 186 300" stroke="#C8F031" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M494 360 C540 360 540 330 584 330" stroke="#C8F031" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="92" cy="330" r="5" fill="#4D5BFF"/><circle cx="186" cy="300" r="5" fill="#4D5BFF"/>
  <circle cx="494" cy="360" r="5" fill="#4D5BFF"/><circle cx="584" cy="330" r="5" fill="#4D5BFF"/>

  <!-- phone -->
  <rect x="22" y="262" width="70" height="136" rx="12" fill="#161A22" stroke="#2A303C" stroke-width="1.5"/>
  <rect x="31" y="278" width="52" height="98" rx="4" fill="#07080C"/>
  <rect x="38" y="288" width="38" height="9" rx="3" fill="#2A303C"/>
  <rect x="38" y="303" width="30" height="20" rx="3" fill="#171B45"/>
  <rect x="45" y="385" width="24" height="3" rx="1.5" fill="#2A303C"/>
  <text x="57" y="428" text-anchor="middle">PHONE</text>

  <!-- computer -->
  <rect x="584" y="284" width="88" height="62" rx="6" fill="#161A22" stroke="#2A303C" stroke-width="1.5"/>
  <rect x="591" y="291" width="74" height="48" rx="3" fill="#07080C"/>
  <path d="M574 353 H680 L672 361 H582 Z" fill="#2A303C"/>
  <text x="627" y="394" text-anchor="middle">COMPUTER</text>
</g></svg>
<img src="../phygital-memory-mark.svg" style="position:absolute;left:915px;top:288px;width:56px">
</body>
