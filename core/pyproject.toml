[project]
name = "phygital-memory"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["../LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cheroot>=10",
    "cryptography>=50.0.2",
    "keyring>=25 ; sys_platform != 'darwin'",
    "mcp>=2.3,<3",
    "pypdf>=6.21.2",
    "wsgidav>=4.3.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
