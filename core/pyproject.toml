[project]
name = "phygital-memory"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cheroot>=10",
    "cryptography>=44",
    "keyring>=25 ; sys_platform != 'darwin'",
    "mcp>=2.3,<3",
    "pypdf>=6.21.2",
    "wsgidav>=4.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
